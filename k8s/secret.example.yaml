# Do NOT commit real credentials. Either:
#   1. Copy this file to k8s/secret.yaml (gitignored), fill in DATABASE_URL, and
#      `kubectl apply -f k8s/secret.yaml`, or
#   2. Create it imperatively:
#      kubectl -n recipebook create secret generic recipebook-db \
#        --from-literal=DATABASE_URL='postgresql://USER:PASS@HOST-pooler.REGION.aws.neon.tech/neondb?sslmode=require'
apiVersion: v1
kind: Secret
metadata:
  name: recipebook-db
  namespace: recipebook
type: Opaque
stringData:
  DATABASE_URL: "REPLACE_ME"
