apiVersion: apps/v1
kind: Deployment
metadata:
  name: recipebook
  namespace: recipebook
  labels:
    app: recipebook
spec:
  replicas: 2
  selector:
    matchLabels:
      app: recipebook
  template:
    metadata:
      labels:
        app: recipebook
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000        # "node" user in the official node image
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: tmp
          emptyDir: {}
      containers:
        - name: recipebook
          # kustomize rewrites this to the ECR image + tag (see kustomization.yaml).
          image: recipebook:latest
          ports:
            - name: http
              containerPort: 3001
          env:
            - name: PORT
              value: "3001"
          envFrom:
            - secretRef:
                name: recipebook-db
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
